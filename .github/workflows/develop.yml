name: "DEV DEPLOY"

on:
  push:
    branches:
      - develop #em caso de push para a branch develop

# Obrigatório para fazer o assume role
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml #usa o workflows que já foi criando aqui.
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::728419474197:role/github-actions-jeftavares-pipeline"
      aws-region: "sa-east-1"
      aws-statefile-s3-bucket: "jeftavares-sa-east-1-terraform-statefile"
      aws-lock-dynamodb-table: "jeftavares-sa-east-1-terraform-lock"